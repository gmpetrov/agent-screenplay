# Replays every docs video script against staging each night, without filming.
# A failing run names the video that went stale and the step that broke.
# Copy to .github/workflows/docs-videos.yml. Needs:
#   - APP_URL: your staging address
#   - DEMO_SESSION (secret): the content of videos/.screenplay/auth.json, made with
#     `npx agent-screenplay login <staging url> -o videos/.screenplay/auth.json`.
#     Sessions expire: refresh the secret when runs start failing at the first step.
name: docs-videos
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y agent-screenplay init
      - run: |
          mkdir -p videos/.screenplay
          echo "$DEMO_SESSION" > videos/.screenplay/auth.json
          status=0
          for f in videos/*.screenplay.json; do
            npx -y agent-screenplay check "$f" || status=1
          done
          exit $status
        env:
          APP_URL: https://staging.example.com
          DEMO_SESSION: ${{ secrets.DEMO_SESSION }}
