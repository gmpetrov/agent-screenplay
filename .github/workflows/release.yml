name: Release
# Publishes to npm when a version tag (v1.2.3) is pushed on a commit of main,
# then creates the GitHub release with notes generated from the merged pull requests.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing and provenance

concurrency: release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the tag
        id: check
        run: |
          V="${GITHUB_REF_NAME#v}"
          P=$(node -p "require('./package.json').version")
          S=$(node -p "require('fs').readFileSync('src/version.ts','utf8').match(/\"(.+)\"/)[1]")
          [ "$V" = "$P" ] || { echo "::error::Tag $GITHUB_REF_NAME, but package.json says $P"; exit 1; }
          [ "$V" = "$S" ] || { echo "::error::Tag $GITHUB_REF_NAME, but src/version.ts says $S"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # A version with a suffix (0.2.0-beta.1) goes to the "next" dist-tag, not "latest".
          case "$V" in *-*) echo "npmtag=next" >> "$GITHUB_OUTPUT"; echo "pre=--prerelease" >> "$GITHUB_OUTPUT";; *) echo "npmtag=latest" >> "$GITHUB_OUTPUT";; esac
          if npm view "agent-screenplay@$V" version >/dev/null 2>&1; then echo "published=true" >> "$GITHUB_OUTPUT"; fi

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Publish to npm
        if: steps.check.outputs.published != 'true'
        # Trusted publishing needs npm 11.5.1 or later. The newest npm is used only here: installed
        # globally before `npm ci`, it left ffmpeg-static without its binary and the tests failed.
        run: npx -y npm@latest publish --access public --provenance --tag "${{ steps.check.outputs.npmtag }}"
        env:
          # Unused once the package trusts this workflow on npmjs.com (trusted publishing).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ${{ steps.check.outputs.pre }}
        env:
          GH_TOKEN: ${{ github.token }}

      # Lists the new version in the official MCP Registry (registry.modelcontextprotocol.io).
      # The registry checks that the npm package's "mcpName" matches server.json's name, so this runs
      # after the npm publish. It runs last, so a registry hiccup cannot skip the GitHub release.
      # Signs in with this workflow's GitHub identity (OIDC), no secret.
      - name: Install cosign
        if: steps.check.outputs.npmtag == 'latest'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish to the MCP Registry
        if: steps.check.outputs.npmtag == 'latest'
        env:
          MCP_PUBLISHER_VERSION: v1.8.7
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          # npm can take a minute to serve a version it just published, and the registry refuses a
          # version it can't find on npm yet.
          for i in $(seq 1 30); do
            npm view "agent-screenplay@$VERSION" version >/dev/null 2>&1 && break
            echo "Waiting for agent-screenplay@$VERSION on npm..."; sleep 10
          done
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
